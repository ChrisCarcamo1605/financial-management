# Base de datos local para desarrollo.
#   docker compose up -d db
# La API crea las tablas al arrancar (db.create_all) y `python seed.py` carga datos de ejemplo.
services:
  db:
    image: postgres:16-alpine
    container_name: caudal-db
    environment:
      POSTGRES_USER: caudal
      POSTGRES_PASSWORD: caudal
      POSTGRES_DB: caudal
    ports:
      - "5433:5432"
    volumes:
      - caudal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caudal -d caudal"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  caudal-db:
